[package]
name = "appkit"
description = "AppKit, Silica's native system toolkit: the shared library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "appkit"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
serde_json = "1"

[dependencies]
vello_cpu.workspace = true
parley.workspace = true
fontique.workspace = true
skrifa = "0.44"
wgpu.workspace = true
png.workspace = true
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
appkit-sys = { path = "../appkit-sys" }
tracing = "0.1"
bitflags = "2"
unicode-segmentation = "1"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
calloop = { version = "0.14", features = ["executor"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
silica-protocols = { path = "../silica-protocols", features = ["client"] }
serde_json = "1"
libloading = "0.8"
rustix = { version = "1", features = ["fs", "pipe"] }
libc = "0.2"
zbus = "5.19"
serde = { version = "1", features = ["derive"] }
futures-lite = "2"
accesskit_unix = "0.24"
accesskit = "0.25"

[dev-dependencies]
async-io = "2"

[lints]
workspace = true
