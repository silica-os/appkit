[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]
default-members = ["crates/*", "examples/*"]


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/silica-os/appkit"
rust-version = "1.99"

[workspace.dependencies]
vello_cpu = { version = "0.3", default-features = false, features = ["std", "text", "png", "u8_pipeline"] }
parley = { version = "0.12", default-features = false, features = ["std", "system"] }
fontique = { version = "0.12", default-features = false, features = ["std", "system", "fontconfig-dlopen", "bytemuck"] }
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles", "wgsl", "std"] }
png = "0.18"
resvg = { version = "0.49", default-features = false }

[workspace.lints.rust]
# "deny" and not "forbid": the FFI surface and the GPU surface re-enable it, only there, each
# block with a SAFETY comment.
unsafe_code = "deny"

# Never crash. They are allowed in tests (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
